name: kalendar_samogon
description: "Календарь самогонщика — рецепты, партии и календарь процессов"
publish_to: 'none'

# Версию синхронизируем с VERSION в корне проекта (docs/CONVENTIONS.md).
version: 0.11.0+13

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Данные
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  uuid: ^4.6.0

  # Утилиты
  intl: ^0.20.3
  path_provider: ^2.1.6

  # Напоминания
  flutter_local_notifications: ^23.0.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

  # Графики
  fl_chart: ^1.3.1

  # Экспорт и бэкап
  share_plus: ^13.3.1
  file_picker: ^13.4.0
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  assets:
    - assets/recipes.json
    - assets/images/
