# Анализатор Flutter-проекта.
#
# Особенность Flutter 3.50: `package:flutter/material.dart` помечен deprecated
# в пользу `package:material_ui/material_ui.dart`. Но material_ui — это полная
# копия Material со своим ThemeData, несовместимым с третьими пакетами
# (fl_chart, flutter_local_notifications и др.), которые импортируют
# flutter/material. Поэтому весь проект держится на flutter/material, а
# deprecation-инфо подавляем здесь. Решение и причина — docs/CONVENTIONS.md.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - lib/**/*.g.dart
  errors:
    deprecated_member_use: ignore

linter:
  rules:
    - prefer_single_quotes
    - always_declare_return_types
